<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OJ Monitor browser smoke</title>
</head>
<body>
  <main><h1>Host OJ page fixture</h1></main>
  <script>
    globalThis.__OJMON_SMOKE_OPEN__ = true;
    const prefix = "oj-monitor:v1:";
    const now = Date.now();
    const dateKeys = Array.from({ length: 30 }, (_, index) => {
      const day = new Date(now - (29 - index) * 86400000);
      return `${day.getFullYear()}-${String(day.getMonth() + 1).padStart(2, "0")}-${String(day.getDate()).padStart(2, "0")}`;
    });
    const groups = [
      { id: "g1", name: "张三", sortOrder: 0, accounts: [{ id: "a1", judge: "codeforces", username: "tourist", enabled: true, sortOrder: 0, scopes: { problemset: true, gym: true } }] },
      { id: "g2", name: "李四", sortOrder: 1, accounts: [{ id: "a2", judge: "atcoder", username: "chokudai", enabled: true, sortOrder: 0 }] },
      { id: "g3", name: "王五", sortOrder: 2, accounts: [{ id: "a3", judge: "qoj", username: "alice", enabled: true, sortOrder: 0 }] }
    ];
    const stats = [];
    for (const [groupIndex, group] of groups.entries()) for (const [index, date] of dateKeys.entries()) {
      stats.push({ groupId: group.id, accountId: group.accounts[0].id, judge: groupIndex === 0 ? "codeforces" : groupIndex === 1 ? "atcoder" : "qoj", scope: groupIndex ? "default" : "problemset", date, submissionCount: (index * (groupIndex + 2)) % 11, solvedCount: (index + groupIndex) % 6, excludedCount: 0, status: index === 24 && groupIndex === 1 ? "partial" : "ok", coverageComplete: !(index === 24 && groupIndex === 1), updatedAt: now });
    }
    const chunks = [
      ["stats:g1:a1:codeforces:problemset:2026", stats.filter((item) => item.groupId === "g1")],
      ["stats:g2:a2:atcoder:default:2026", stats.filter((item) => item.groupId === "g2")],
      ["stats:g3:a3:qoj:default:2026", stats.filter((item) => item.groupId === "g3")]
    ];
    const values = new Map([
      [prefix + "config", { schemaVersion: 1, groups, settings: { days: 30, timeZone: "local", metric: "solved", autoRefreshMinutes: 15, theme: "system" } }],
      [prefix + "stats-index", chunks.map(([name]) => name)],
      ...chunks.map(([name, value]) => [prefix + name, value]),
      [prefix + "submission-index", []],
      [prefix + "last-refresh", { at: now, dateKeys, sourceCount: 2 }]
    ]);
    globalThis.GM_getValue = async (key, fallback) => values.has(key) ? values.get(key) : fallback;
    globalThis.GM_setValue = async (key, value) => values.set(key, value);
    globalThis.GM_deleteValue = async (key) => values.delete(key);
    globalThis.GM_listValues = async () => [...values.keys()];
  </script>
  <script src="../dist/oj-monitor.user.js"></script>
  <script>
    if (new URLSearchParams(location.search).get("state") === "collapsed-submissions") {
      const applySmokeState = () => {
        const panel = globalThis.__OJ_MONITOR_APP__?.panel;
        if (!panel?.root || panel.root.classList.contains("oj-monitor-hidden")) {
          setTimeout(applySmokeState, 10);
          return;
        }
        panel.metric = "submissions";
        panel.dailyTableExpanded = false;
        panel.render();
        document.documentElement.dataset.smokeState = "collapsed-submissions";
      };
      applySmokeState();
    }
  </script>
</body>
</html>
